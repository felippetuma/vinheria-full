# IoT Agent (4041)
server {
    listen 4041;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, fiware-service, fiware-servicepath" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }

        proxy_pass http://iot-agent:4041;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "fiware-total-count" always;
    }
}

