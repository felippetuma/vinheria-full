<rect width="1860" height="1225" fill="#ffffff"/>
<text x="40" y="46" font-size="28" fill="#0f172a" font-weight="700" text-anchor="start">Vinheria Full · Fluxo de comando de alerta</text>
<text x="40" y="72" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">CP5 · do dashboard ao atuador · App → Orion → IoT Agent → Mosquitto → ESP32 (LED azul + buzzer)</text>
<rect x="40" y="100" width="1780" height="178" rx="22" fill="#f5eefa" stroke="#8e4fb3" stroke-width="1.6"/>
<text x="64" y="130" font-size="13" fill="#7c3aed" font-weight="700" text-anchor="start" letter-spacing="2">APLICAÇÃO</text>
<text x="177" y="130" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">decide e envia o alerta</text>
<text x="64" y="204.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">App do dashboard</text>
<text x="64" y="221.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">Expo · React Native</text>
<rect x="40" y="308" width="1780" height="434" rx="22" fill="#eef4fc" stroke="#5b84c4" stroke-width="1.6"/>
<text x="64" y="338" font-size="13" fill="#1e40af" font-weight="700" text-anchor="start" letter-spacing="2">BACK-END</text>
<text x="166" y="338" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">Docker Compose na EC2 (AWS)</text>
<text x="64" y="412.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Orion</text>
<text x="64" y="429.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">estado atual das entidades</text>
<line x1="64" y1="478" x2="1796" y2="478" stroke="#5b84c4" stroke-width="1" opacity=".35"/>
<text x="64" y="540.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">IoT Agent UltraLight</text>
<text x="64" y="557.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">traduz NGSIv2 ↔ MQTT</text>
<line x1="64" y1="606" x2="1796" y2="606" stroke="#5b84c4" stroke-width="1" opacity=".35"/>
<text x="64" y="668.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Eclipse Mosquitto</text>
<text x="64" y="685.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">broker MQTT</text>
<rect x="40" y="772" width="1780" height="178" rx="22" fill="#e9f6f1" stroke="#1f8a7a" stroke-width="1.6"/>
<text x="64" y="802" font-size="13" fill="#047857" font-weight="700" text-anchor="start" letter-spacing="2">IoT</text>
<text x="111" y="802" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">dispositivo que sente e atua</text>
<text x="64" y="876.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">ESP32 DevKit V1</text>
<text x="64" y="893.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">LED GPIO2 · buzzer GPIO25</text>
<path d="M450 206.0 L567.0 206.0 L567.0 360.0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-ea580c)"/>
