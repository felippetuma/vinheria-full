<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 1225" width="1860" height="1225" font-family="Inter, 'Segoe UI', Arial, 'DejaVu Sans', sans-serif">
<title>Fluxo de comando de alerta da Vinheria Full</title>
<defs>
<marker id="a-0f9d8a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L11 6 L0 11 Z" fill="#0f9d8a"/></marker>
