<circle cx="732.5" cy="414.0" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="732.5" y="418.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">B</text>
<path d="M898 542.0 L1015.0 542.0 L1015.0 616.0" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#a-ea580c)"/>
<circle cx="956.5" cy="542.0" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="956.5" y="546.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">C</text>
<path d="M1122 670.0 L1239.0 670.0 L1239.0 824.0" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#a-ea580c)"/>
<circle cx="1180.5" cy="670.0" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="1180.5" y="674.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">D</text>
<path d="M1346 878.0 L1463.0 878.0 L1463.0 724.0" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#a-ea580c)"/>
<circle cx="1404.5" cy="878.0" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="1404.5" y="882.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">E</text>
<path d="M1570 670.0 L1687.0 670.0 L1687.0 596.0" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#a-ea580c)"/>
<circle cx="1628.5" cy="670.0" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="1628.5" y="674.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">F</text>
<rect x="236" y="152.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="236" y="152.0" width="7" height="108" rx="3" fill="#7c3aed"/>
<text x="254" y="174.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">HTTP · NGSIV2</text>
<text x="254" y="197.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Envia o comando</text>
<text x="254" y="217.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">PATCH /v2/entities/{id}/attrs</text>
<text x="254" y="233.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">alertTemp · alertHum</text>
<text x="254" y="249.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">alertLum · alertOff</text>
<rect x="460" y="360.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="460" y="360.0" width="7" height="108" rx="3" fill="#1d4ed8"/>
<rect x="615.0" y="369.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="638.5" y="381.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:1026</text>
<text x="478" y="382.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">HTTP · NGSIV2</text>
<text x="478" y="405.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Encaminha o comando</text>
<text x="478" y="425.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">atributo do tipo command,</text>
<text x="478" y="441.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">registrado no cadastro</text>
<text x="478" y="457.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">do device</text>
<rect x="684" y="488.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="684" y="488.0" width="7" height="108" rx="3" fill="#1d4ed8"/>
<rect x="839.0" y="497.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="862.5" y="509.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:4041</text>
<text x="702" y="510.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">NGSIV2 → MQTT</text>
<text x="702" y="533.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Traduz o comando</text>
<text x="702" y="553.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">recebe do Orion e publica em</text>
<text x="702" y="569.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">/TEF/vinheria001/cmd</text>
<text x="702" y="585.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">vinheria001@alertTemp|</text>
<rect x="908" y="616.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="908" y="616.0" width="7" height="108" rx="3" fill="#94a3b8"/>
<rect x="1063.0" y="625.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="1086.5" y="637.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:1883</text>
<text x="926" y="638.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">MQTT</text>
<text x="926" y="661.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Entrega ao ESP32</text>
<text x="926" y="681.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">o ESP32 assina</text>
<text x="926" y="697.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">/TEF/vinheria001/cmd</text>
<text x="926" y="713.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">vinheria001@alertTemp|</text>
<rect x="1132" y="824.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="1132" y="824.0" width="7" height="108" rx="3" fill="#0f9d7a"/>
<text x="1150" y="846.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">EXECUTA</text>
<text x="1150" y="869.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Aciona o alerta</text>
<text x="1150" y="889.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">LED azul pisca e buzzer</text>
<text x="1150" y="905.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">toca o padrão da métrica</text>
<text x="1150" y="921.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">alertOff encerra o remoto</text>
<rect x="1356" y="616.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="1356" y="616.0" width="7" height="108" rx="3" fill="#94a3b8"/>
<rect x="1511.0" y="625.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="1534.5" y="637.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:1883</text>
<text x="1374" y="638.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">MQTT</text>
<text x="1374" y="661.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Recebe a confirmação</text>
<text x="1374" y="681.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">/TEF/vinheria001/cmdexe</text>
<text x="1374" y="697.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">vinheria001@alertTemp|ok</text>
<text x="1374" y="713.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">desconhecido → unknown command</text>
<rect x="1580" y="488.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="1580" y="488.0" width="7" height="108" rx="3" fill="#1d4ed8"/>
<rect x="1735.0" y="497.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="1758.5" y="509.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:4041</text>
<text x="1598" y="510.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">MQTT → NGSIV2</text>
<text x="1598" y="533.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Recebe o resultado</text>
<text x="1598" y="553.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">entrega a confirmação</text>
<text x="1598" y="569.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">do comando ao IoT Agent</text>
<text x="1598" y="585.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">(protocolo UltraLight)</text>
<rect x="40" y="975" width="1780" height="215" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="64" y="1007" font-size="14" fill="#ea580c" font-weight="700" text-anchor="start">Comando: do dashboard ao atuador</text>
<circle cx="76" cy="1027" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="76" y="1031.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">A</text>
<text x="98" y="1031" font-size="12" fill="#334155" font-weight="400" text-anchor="start">App envia alertTemp/Hum/Lum/Off ao Orion (PATCH)</text>
<circle cx="76" cy="1049" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="76" y="1053.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">B</text>
<text x="98" y="1053" font-size="12" fill="#334155" font-weight="400" text-anchor="start">Orion repassa ao IoT Agent (comando registrado)</text>
<circle cx="76" cy="1071" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="76" y="1075.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">C</text>
<text x="98" y="1075" font-size="12" fill="#334155" font-weight="400" text-anchor="start">IoT Agent publica vinheria001@cmd| em /TEF/vinheria001/cmd</text>
<circle cx="76" cy="1093" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="76" y="1097.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">D</text>
<text x="98" y="1097" font-size="12" fill="#334155" font-weight="400" text-anchor="start">Mosquitto entrega ao ESP32, que aciona LED e buzzer</text>
<circle cx="76" cy="1115" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="76" y="1119.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">E</text>
<text x="98" y="1119" font-size="12" fill="#334155" font-weight="400" text-anchor="start">ESP32 confirma em /TEF/vinheria001/cmdexe (...|ok)</text>
<circle cx="76" cy="1137" r="11.5" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<text x="76" y="1141.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">F</text>
<text x="98" y="1141" font-size="12" fill="#334155" font-weight="400" text-anchor="start">Mosquitto entrega a confirmação ao IoT Agent</text>
<text x="780" y="1007" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Observações</text>
<text x="780" y="1031" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">O app compara o valor atual com os triggers. Quando o conjunto</text>
<text x="780" y="1051" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">de anomalias muda, envia alertOff e depois um comando por anomalia.</text>
<text x="780" y="1071" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Depois de confirmar, o ESP32 publica s|on ou s|off em /attrs.</text>
<text x="780" y="1091" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">Padrões do buzzer: temperatura 2 bipes · umidade 1 longo ·</text>
<text x="780" y="1111" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">luminosidade 3 curtos. Valor normal → alertOff.</text>
<text x="1400" y="1007" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Como ler</text>
<path d="M1400 1033 L1456 1033" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-64748b)"/>
<text x="1468" y="1037" font-size="12" fill="#334155" font-weight="400" text-anchor="start">HTTP / NGSIv2 (REST)</text>
<path d="M1400 1055 L1456 1055" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#a-64748b)"/>
<text x="1468" y="1059" font-size="12" fill="#334155" font-weight="400" text-anchor="start">MQTT</text>
<path d="M1400 1077 L1456 1077" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="1.5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-64748b)"/>
<text x="1468" y="1081" font-size="12" fill="#334155" font-weight="400" text-anchor="start">MongoDB</text>
<rect x="1400" y="1103" width="14" height="14" rx="3" fill="#0f9d8a"/>
<text x="1420" y="1115" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">telemetria</text>
<rect x="1530" y="1103" width="14" height="14" rx="3" fill="#ea580c"/>
<text x="1550" y="1115" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">comando</text>
<rect x="1660" y="1103" width="14" height="14" rx="3" fill="#64748b"/>
<text x="1680" y="1115" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">configuração</text>
<text x="1400" y="1139" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">As setas partem de quem inicia a comunicação.</text>
<text x="1400" y="1157" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">Barra azul = FIWARE GE · cinza = complementar.</text>
</svg>
