<text x="508.5" y="1138.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<path d="M674 926.0 L791.0 926.0 L791.0 852.0" fill="none" stroke="#0f9d8a" stroke-width="2" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#a-0f9d8a)"/>
