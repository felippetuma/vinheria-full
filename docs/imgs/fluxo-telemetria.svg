<text x="732.5" y="930.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<path d="M898 798.0 L1015.0 798.0 L1015.0 724.0" fill="none" stroke="#0f9d8a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-0f9d8a)"/>
<circle cx="956.5" cy="798.0" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="956.5" y="802.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<path d="M1122 670.0 L1239.0 670.0 L1239.0 596.0" fill="none" stroke="#0f9d8a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-0f9d8a)"/>
<circle cx="1180.5" cy="670.0" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="1180.5" y="674.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<path d="M1346 542.0 L1463.0 542.0 L1463.0 468.0" fill="none" stroke="#0f9d8a" stroke-width="2" stroke-dasharray="1.5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-0f9d8a)"/>
<circle cx="1404.5" cy="542.0" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="1404.5" y="546.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<path d="M1580 206.0 L1239.0 206.0 L1239.0 488.0" fill="none" stroke="#0f9d8a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-0f9d8a)"/>
<circle cx="1409.5" cy="206.0" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="1409.5" y="210.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">6</text>
<rect x="236" y="1080.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="236" y="1080.0" width="7" height="108" rx="3" fill="#0f9d7a"/>
<text x="254" y="1102.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">MQTT · A CADA 5 S</text>
<text x="254" y="1125.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Publica t, h e l</text>
<text x="254" y="1145.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">um valor puro por tópico</text>
<text x="254" y="1161.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">/TEF/vinheria001/attrs/t</text>
<text x="254" y="1177.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">também /h e /l (0 a 100 %)</text>
<rect x="460" y="872.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="460" y="872.0" width="7" height="108" rx="3" fill="#94a3b8"/>
<rect x="615.0" y="881.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="638.5" y="893.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:1883</text>
<text x="478" y="894.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">MQTT</text>
<text x="478" y="917.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Entrega a mensagem</text>
<text x="478" y="937.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">o IoT Agent assina os tópicos</text>
<text x="478" y="953.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">do service group TEF</text>
<text x="478" y="969.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">(apikey TEF)</text>
<rect x="684" y="744.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="684" y="744.0" width="7" height="108" rx="3" fill="#1d4ed8"/>
<rect x="839.0" y="753.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="862.5" y="765.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:4041</text>
<text x="702" y="766.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">MQTT → NGSIV2</text>
<text x="702" y="789.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Converte os atributos</text>
<text x="702" y="809.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">t → temperature</text>
<text x="702" y="825.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">h → humidity</text>
<text x="702" y="841.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">l → luminosity</text>
<rect x="908" y="616.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="908" y="616.0" width="7" height="108" rx="3" fill="#1d4ed8"/>
<rect x="1063.0" y="625.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="1086.5" y="637.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:1026</text>
<text x="926" y="638.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">HTTP · NGSIV2</text>
<text x="926" y="661.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Atualiza a entidade</text>
<text x="926" y="681.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">temperature, humidity e</text>
<text x="926" y="697.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">luminosity da entidade</text>
<text x="926" y="713.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">do device vinheria001</text>
<rect x="1132" y="488.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="1132" y="488.0" width="7" height="108" rx="3" fill="#1d4ed8"/>
<rect x="1287.0" y="497.0" width="47.0" height="18" rx="9" fill="#1d4ed8"/>
<text x="1310.5" y="509.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:8666</text>
<text x="1150" y="510.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">NOTIFICAÇÃO</text>
<text x="1150" y="533.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Recebe a notificação</text>
<text x="1150" y="553.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">subscription criada pelo app</text>
<text x="1150" y="569.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">no cadastro do device</text>
<text x="1150" y="585.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">→ sth-comet:8666/notify</text>
<rect x="1356" y="360.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="1356" y="360.0" width="7" height="108" rx="3" fill="#94a3b8"/>
<rect x="1504.4" y="369.0" width="53.6" height="18" rx="9" fill="#1d4ed8"/>
<text x="1531.2" y="381.5" font-size="10.5" fill="#fff" font-weight="700" text-anchor="middle">:27017</text>
<text x="1374" y="382.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">MONGODB</text>
<text x="1374" y="405.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Grava a série temporal</text>
<text x="1374" y="425.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">banco sth_&lt;service&gt;</text>
<text x="1374" y="441.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">mongo-db-historical</text>
<rect x="1580" y="152.0" width="214" height="108" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh)"/>
<rect x="1580" y="152.0" width="7" height="108" rx="3" fill="#7c3aed"/>
<text x="1598" y="174.0" font-size="9" fill="#94a3b8" font-weight="700" text-anchor="start" letter-spacing="1">HTTP · A CADA 5 S</text>
<text x="1598" y="197.0" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="start">Consulta o histórico</text>
<text x="1598" y="217.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">GET /STH/v1/contextEntities/</text>
<text x="1598" y="233.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">type/{tipo}/id/{id}/</text>
<text x="1598" y="249.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">attributes/{métrica}?lastN=N</text>
<rect x="40" y="1231" width="1780" height="215" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="64" y="1263" font-size="14" fill="#0f9d8a" font-weight="700" text-anchor="start">Telemetria: do sensor ao dashboard</text>
<circle cx="76" cy="1283" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="76" y="1287.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="98" y="1287" font-size="12" fill="#334155" font-weight="400" text-anchor="start">ESP32 publica t, h e l em /TEF/vinheria001/attrs</text>
<circle cx="76" cy="1305" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="76" y="1309.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="98" y="1309" font-size="12" fill="#334155" font-weight="400" text-anchor="start">Mosquitto entrega ao IoT Agent (inscrito nos tópicos)</text>
<circle cx="76" cy="1327" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="76" y="1331.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="98" y="1331" font-size="12" fill="#334155" font-weight="400" text-anchor="start">IoT Agent atualiza a entidade no Orion</text>
<circle cx="76" cy="1349" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="76" y="1353.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="98" y="1353" font-size="12" fill="#334155" font-weight="400" text-anchor="start">Orion notifica o STH-Comet (subscription)</text>
<circle cx="76" cy="1371" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="76" y="1375.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">5</text>
<text x="98" y="1375" font-size="12" fill="#334155" font-weight="400" text-anchor="start">STH-Comet grava a série temporal no MongoDB</text>
<circle cx="76" cy="1393" r="11.5" fill="#0f9d8a" stroke="#fff" stroke-width="2"/>
<text x="76" y="1397.3" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">6</text>
<text x="98" y="1397" font-size="12" fill="#334155" font-weight="400" text-anchor="start">App consulta o histórico no STH-Comet (:8666)</text>
<text x="780" y="1263" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Observações</text>
<text x="780" y="1287" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">O ESP32 também publica s|on ou s|off (estado dos atuadores)</text>
<text x="780" y="1307" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">em /TEF/vinheria001/attrs, a cada 10 s e a cada mudança.</text>
<text x="780" y="1327" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">O valor atual vem do Orion (GET /v2/entities/{id}, :1026),</text>
<text x="780" y="1347" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">também a cada 5 s. O valor l já chega em % (0 a 100).</text>
<text x="780" y="1367" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start">O app acessa :4041 e :8666 pelo Nginx (CORS).</text>
<text x="1400" y="1263" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">Como ler</text>
<path d="M1400 1289 L1456 1289" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-64748b)"/>
<text x="1468" y="1293" font-size="12" fill="#334155" font-weight="400" text-anchor="start">HTTP / NGSIv2 (REST)</text>
<path d="M1400 1311 L1456 1311" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="9 6" stroke-linejoin="round" marker-end="url(#a-64748b)"/>
<text x="1468" y="1315" font-size="12" fill="#334155" font-weight="400" text-anchor="start">MQTT</text>
<path d="M1400 1333 L1456 1333" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="1.5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-64748b)"/>
<text x="1468" y="1337" font-size="12" fill="#334155" font-weight="400" text-anchor="start">MongoDB</text>
<rect x="1400" y="1359" width="14" height="14" rx="3" fill="#0f9d8a"/>
<text x="1420" y="1371" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">telemetria</text>
<rect x="1530" y="1359" width="14" height="14" rx="3" fill="#ea580c"/>
<text x="1550" y="1371" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">comando</text>
<rect x="1660" y="1359" width="14" height="14" rx="3" fill="#64748b"/>
<text x="1680" y="1371" font-size="11.5" fill="#334155" font-weight="400" text-anchor="start">configuração</text>
<text x="1400" y="1395" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">As setas partem de quem inicia a comunicação.</text>
<text x="1400" y="1413" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">Barra azul = FIWARE GE · cinza = complementar.</text>
</svg>
